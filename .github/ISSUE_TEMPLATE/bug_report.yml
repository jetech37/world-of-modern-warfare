name: Bug report
description: Something in the game, the launcher or the server doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please don't attach game files or anything read from them.
        Security problems: see SECURITY.md instead of opening an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as a level 10 Hunter in Elwynn Forest
        2. Equip ...
        3. ...
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options:
        - Game (client)
        - Game server / rules
        - Launcher
        - Website / sign-up
        - Hosting scripts (vps/, admin/, package/)
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Game version
      description: The version the launcher shows, or the commit you built from.
  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: The crash report the launcher saved, or relevant log lines (remove anything private).
      render: text
