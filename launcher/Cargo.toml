[package]
name = "aw-launcher"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "World of Modern Warfare for friends: installs, logs in with a game account, keeps the game up to date and starts it"

[[bin]]
name = "WorldOfModernWarfare"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rpassword = "7"
base64 = "0.22"
# Crash dumps go up gzipped (crash.rs).
flate2 = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
opt-level = 3
strip = true
lto = true

[build-dependencies]
winresource = "0.1"
